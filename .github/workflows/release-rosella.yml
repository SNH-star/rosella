name: Publish Release

on:
  push:
    tags:
      - v*
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-musl-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build (musl)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package binaries
        run: |
          mkdir -p release/
          cp "target/x86_64-unknown-linux-musl/release/rosella" INSTALL.md release/

      - name: Compress action step
        id: compress
        uses: a7ul/tar-action@v1.2.0
        with:
          command: c
          cwd: ./
          files: |
            ./release/
          outPath: rosella-x86_64-unknown-linux-musl-${{ env.RELEASE_VERSION }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: binary
          path: rosella-x86_64-unknown-linux-musl-${{ env.RELEASE_VERSION }}.tar.gz

      - name: Create a Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          automatic_release_tag: ${{ env.RELEASE_VERSION }}
          title: ${{ env.RELEASE_VERSION }}
          files: |
            rosella-x86_64-unknown-linux-musl-${{ env.RELEASE_VERSION }}.tar.gz
